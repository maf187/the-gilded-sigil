<section class="sigil-container architect-container">
  <h2>Spell Jar Architect</h2>
  <p class="tagline-sub">Formulate sacred botanical layers, crystal matrixes, and seal correspondences.</p>

  <div class="architect-controls">
  <label for="intentInput" class="control-label">State Your Freeform Intention:</label>
  <div class="input-group">
    <input 
      type="text" 
      id="intentInput" 
      placeholder="e.g., Attract wealth and financial clarity, or Shield home from negativity..."
      autocomplete="off"
    >
    <button id="formulateBtn" type="button">Formulate Jar</button>
  </div>
  <p id="intentFeedback" style="color: #a8a396; font-size: 0.95rem; font-style: italic; margin-top: 0.5rem;"></p>
  </div>

  <div id="recipeOutput" class="recipe-output" style="display: none;">
    
    <!-- Visual Vessel Representation -->
    <div class="jar-visual-wrapper">
      <div class="jar-graphic" id="jarGraphic">
        <div class="jar-cork" id="corkSeal"></div>
        <div class="jar-glass">
          <div class="jar-layer layer-crystal" id="visualCrystal" title="Crystal Point"></div>
          <div class="jar-layer layer-herb-2" id="visualHerb2" title="Secondary Botanical"></div>
          <div class="jar-layer layer-herb-1" id="visualHerb1" title="Primary Botanical"></div>
          <div class="jar-layer layer-base" id="visualBase" title="Mineral Base"></div>
        </div>
      </div>
    </div>

    <!-- Structured Recipe Formula -->
    <div class="recipe-blueprint">
      <h3 class="blueprint-title">Ritual Recipe Blueprint</h3>
      <p class="blueprint-desc">Layer ingredients from the foundation upward to anchor intention into physical form.</p>

      <div class="ingredient-stack" id="ingredientStack">
        <!-- Dynamically generated ingredient cards populate here -->
      </div>

      <div class="sealing-section" id="sealingSection">
        <!-- Sealing wax details populate here -->
      </div>
    </div>

  </div>
</section>
