<section class="sigil-container">
  <h2>Interactive Sigil Forge</h2>
  <p>Enter your statement of intent to reduce letters and forge your personal mark.</p>

    <input type="text" id="intentInput" placeholder="ENTER YOUR INTENTION (E.G. PROTECTION AND CLARITY)" autocomplete="off">

  </div>

  <div class="reduced-display">
    <span class="label">Reduced Consonants:</span>
    <span id="consonantsDisplay">—</span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="sigilCanvas" width="500" height="500"></canvas>
  </div>

  <div class="action-buttons">
    <button id="downloadBtn" type="button">Download Sigil (PNG)</button>
  </div>
  <p class="teaser-badge">Custom printed ritual mugs & candles coming soon.</p>
