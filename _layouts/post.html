---
layout: default
---
<article class="article-container">
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
    <time class="article-date">{{ page.date | date: "%B %d, %Y" }}</time>
  </header>
  
  <div class="article-body">
    {{ content }}
  </div>
</article>
