---
layout: default
---

<article class="sigil-container article-container">
  <header class="article-header">
    <h2 class="article-title">{{ page.title }}</h2>
    <p class="article-date">{{ page.date | date: "%B %d, %Y" }}</p>
  </header>

  <div class="article-body">
    {{ content }}
  </div>

  <script>
    document.querySelectorAll('.article-body input[type="checkbox"]').forEach(box => {
      box.removeAttribute('disabled');
      box.style.cursor = 'pointer';
    });
  </script>
</article>
